spring.application.name=sweetshop

# ======================
# DATABASE CONFIGURATION
# ======================
spring.datasource.url=jdbc:postgresql://localhost:5432/sweetshop
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - use Hibernate to manage schema
# Options: validate | update | create | create-drop | none
# - update: alter the schema to match entities (dev-friendly)
# - validate: check schema matches entities (safer)
# - none: don't touch DB (prod)
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ======================================
# SPRING SECURITY / JWT CONFIGURATION
# ======================================
jwt.secret=bXlTZWNyZXRLZXlGb3JaaW5pb3NPbmJvYXJkU2VydmljZQ==
jwt.expiration=86400000
# comma-separated patterns allowed without auth
auth.whitelist.urls=/api/auth/**

# ======================
# SERVER CONFIGURATION
# ======================
server.port=8080

# Preferred: force JDBC/Hibernate to use UTC (safe)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

